<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>1. Xem Dashboard & Bộ lọc đa chiều — Sơ Đồ Quy Trình Swimlane</title>
<style>
  body { font-family: Calibri, Arial, sans-serif; background: #f8f9fa; margin: 24px; color: #202124; }
  .container { max-width: 780px; margin: 0 auto; background: #ffffff; padding: 24px; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); }
  .title { font-size: 15pt; font-weight: bold; color: #1a73e8; margin-bottom: 6px; }
  .desc { font-size: 11pt; color: #5f6368; margin-bottom: 18px; }
  .diagram-box { padding: 12px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 6px; text-align: center; }
</style>
</head>
<body>
<div class="container">
  <div class="title">1. Xem Dashboard & Bộ lọc đa chiều</div>
  <div class="desc">Sơ đồ quy trình Swimlane BPMN chuẩn FPT SOP (User vs BE). Dùng phím tắt <b>Windows + Shift + S</b> để chụp ảnh dán vào Excel.</div>
  <div class="diagram-box">
    <svg width="720" height="370" xmlns="http://www.w3.org/2000/svg" style="font-family:Calibri,Arial,sans-serif;font-size:11pt;background:#ffffff;">
  <!-- Top Badge -->
  <rect x="10" y="8" width="200" height="26" rx="4" ry="4" fill="#f0f4f9" stroke="#b0c4de" stroke-width="1"/>
  <text x="110" y="25" text-anchor="middle" font-size="10pt" font-weight="bold" fill="#475569">Xem Dashboard &amp; Bộ lọc</text>
  <!-- Outer Box -->
  <rect x="10" y="42" width="700" height="315" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="4"/>
  <!-- Header Bar -->
  <rect x="10" y="42" width="700" height="42" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5" rx="4"/>
  <!-- Lane Divider -->
  <line x1="360" y1="42" x2="360" y2="357" stroke="#d0d7de" stroke-width="1.5"/>
  <!-- Lane Titles -->
  <text x="180" y="68" text-anchor="middle" font-size="13pt" font-weight="bold" fill="#24292f">User</text>
  <text x="540" y="68" text-anchor="middle" font-size="13pt" font-weight="bold" fill="#24292f">BE</text>
  <!-- Start Node -->
  <circle cx="180" cy="115" r="22" fill="#e8dcfc" stroke="#222" stroke-width="1.5"/>
  <text x="180" y="120" text-anchor="middle" font-size="10.5pt" font-weight="bold" fill="#222">Start</text>

  <!-- Arrow Start -> User Box (Solid Down) -->
  <line x1="180" y1="137" x2="180" y2="167" stroke="#222" stroke-width="1.5"/>
  <polygon points="180,175 174,163 186,163" fill="#222"/>

  <!-- User Action Box -->
  <rect x="40" y="175" width="280" height="74" rx="6" ry="6" fill="#f0f4f9" stroke="#222" stroke-width="1.5"/>
  <text x="180" y="198" text-anchor="middle" font-size="9.5pt" fill="#222">Trên menu SOP, tại nhóm <tspan font-weight="bold">Tiếp thị liên kết</tspan>,</text>
  <text x="180" y="218" text-anchor="middle" font-size="9.5pt" fill="#222">chọn <tspan font-weight="bold">Dashboard Báo Cáo AM</tspan></text>
  <text x="180" y="238" text-anchor="middle" font-size="9.5pt" fill="#222">&amp; tùy chỉnh Bộ lọc (Khoảng ngày, Vùng/CN)</text>

  <!-- Dashed Arrow: User -> BE (Across Lane) -->
  <line x1="320" y1="212" x2="388" y2="212" stroke="#222" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="400,212 388,206 388,218" fill="#222"/>

  <!-- BE Response Box -->
  <rect x="400" y="175" width="280" height="74" rx="6" ry="6" fill="#f0f4f9" stroke="#222" stroke-width="1.5"/>
  <text x="540" y="198" text-anchor="middle" font-size="9.5pt" fill="#222">Kiểm tra thẩm quyền SSO, tổng hợp dữ liệu</text>
  <text x="540" y="218" text-anchor="middle" font-size="9.5pt" fill="#222">và hiển thị <tspan font-weight="bold">5 thẻ KPI realtime</tspan></text>
  <text x="540" y="238" text-anchor="middle" font-size="9.5pt" fill="#222">kèm tỷ lệ tăng trưởng Like-for-like <tspan font-weight="bold">[upto]</tspan></text>

  <!-- Arrow BE Box -> END (Solid Down) -->
  <line x1="540" y1="249" x2="540" y2="282" stroke="#222" stroke-width="1.5"/>
  <polygon points="540,290 534,278 546,278" fill="#222"/>

  <!-- END Node -->
  <circle cx="540" cy="312" r="22" fill="#daf2e4" stroke="#222" stroke-width="1.5"/>
  <text x="540" y="317" text-anchor="middle" font-size="10pt" font-weight="bold" fill="#222">END</text>
</svg>
  </div>
</div>
</body>
</html>
